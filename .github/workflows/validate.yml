name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
        with:
          fetch-depth: 0 # diff contra la base: presencia de worklog e historial append-only
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pyyaml jsonschema
      - name: Validar config contra JSON Schema e invariantes
        run: python scripts/validate-config.py
      - name: Autocomprobación del validador (fixtures)
        run: python scripts/test-validate-config.py
      - name: Autocomprobación de worklog
        run: python scripts/test-worklog.py
      - name: Comprobar metadatos de versión
        run: python scripts/check-version-metadata.py
      - name: Historial solo crece (sin filas borradas ni reescritas)
        run: python scripts/check-history-append-only.py
      - name: Comprobar ADRs del core (numeración, estado, fechas)
        run: python scripts/check-adrs.py
      - name: Autocomprobación de fechas y ADRs (fixtures)
        run: python scripts/test-dates.py
      - name: Medir andamiaje extraído del handbook
        run: python scripts/measure-handbook-scaffolding.py
      - name: Validar plantilla de worklog
        run: python scripts/validate-worklog.py --plantilla templates/worklog.md
      - name: Validar worklogs del core
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(worklogs/**/*.md)
          if [ ${#files[@]} -gt 0 ]; then python scripts/validate-worklog.py "${files[@]}"; fi
      - name: Presencia de worklog si el diff toca código de producto
        run: python scripts/check-worklog-presence.py
      - name: Comprobar rutas locales citadas
        run: python scripts/check-local-links.py --strict-anchors --strict-orphans
      - name: markdownlint (fences y enlaces vacíos)
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            AGENTS.md.template
            !scripts/testdata/**

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias de docs
        run: pip install -r requirements-docs.txt
      - name: Build estricto (falla con nav/enlaces rotos)
        run: mkdocs build --strict -f mkdocs/mkdocs.yml
