name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pyyaml jsonschema
      - name: Validar examples contra JSON Schema
        run: python scripts/validate-examples.py
      - name: Comprobar rutas locales citadas
        run: python scripts/check-local-links.py
