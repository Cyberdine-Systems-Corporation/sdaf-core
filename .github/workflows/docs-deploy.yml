name: docs-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike necesita el historial de gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de docs
        run: pip install -r requirements-docs.txt
      - name: Configurar git para mike
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Deploy versión de desarrollo (push a main)
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases dev
      - name: Deploy versión de release (push de tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
