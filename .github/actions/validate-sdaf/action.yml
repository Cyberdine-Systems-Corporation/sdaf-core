name: validate-sdaf
description: Valida sdaf.config.yaml (schema + invariantes) y, opcionalmente, la presencia de worklog, los ADRs del consumidor y las comprobaciones mecánicas de Gate 0.

inputs:
  config-paths:
    description: Rutas YAML del consumidor, separadas por espacio.
    required: false
    default: sdaf.config.yaml
  check-worklog:
    description: Comprobar presencia de worklog si el diff toca código de producto.
    required: false
    default: "true"
  strict-i4:
    description: Tratar I4 como error.
    required: false
    default: "false"
  check-adrs:
    description: Comprobar los ADRs del consumidor con el modo consumidor de check-adrs.py.
    required: false
    default: "false"
  adrs-legacy-up-to:
    description: Número del último ADR heredado (anterior a la adopción); 0 = ninguno. Solo se usa con check-adrs.
    required: false
    default: "0"
  check-gate0:
    description: Ejecutar las comprobaciones MECÁNICAS de Gate 0 del PBI en curso con check-gate0.py. Bloqueante (falla el paso si hay algún FAIL); no aprueba nada ni sustituye el juicio humano de G0.3. Si el PBI se deduce del diff, el checkout necesita fetch-depth 0.
    required: false
    default: "false"
  gate0-pbi:
    description: IDs o rutas de PBI a comprobar, separados por espacio (anula la selección por diff). Vacío = el PBI en curso se deduce del diff del PR. Solo se usa con check-gate0.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Instalar dependencias del validador
      shell: bash
      run: pip install pyyaml jsonschema
    - name: Validar config
      shell: bash
      env:
        SDAF_ACTION_ROOT: ${{ github.action_path }}
        SDAF_CONFIG_PATHS: ${{ inputs.config-paths }}
        SDAF_STRICT_I4: ${{ inputs.strict-i4 }}
      run: |
        set -euo pipefail
        ROOT="$(cd "${SDAF_ACTION_ROOT}/../../.." && pwd)"
        FLAGS=()
        if [ "${SDAF_STRICT_I4}" = "true" ]; then
          FLAGS+=(--strict-i4)
        fi
        FLAGS+=(--consumer-root "${GITHUB_WORKSPACE}")
        # shellcheck disable=SC2086
        python "${ROOT}/scripts/validate-config.py" "${FLAGS[@]}" ${SDAF_CONFIG_PATHS}
    - name: Presencia de worklog
      if: inputs.check-worklog == 'true'
      shell: bash
      run: |
        set -euo pipefail
        ROOT="$(cd "${{ github.action_path }}/../../.." && pwd)"
        python "${ROOT}/scripts/check-worklog-presence.py" --cwd "${GITHUB_WORKSPACE}"
    - name: ADRs del consumidor
      if: inputs.check-adrs == 'true'
      shell: bash
      env:
        SDAF_ACTION_ROOT: ${{ github.action_path }}
        SDAF_ADRS_LEGACY_UP_TO: ${{ inputs.adrs-legacy-up-to }}
      run: |
        set -euo pipefail
        ROOT="$(cd "${SDAF_ACTION_ROOT}/../../.." && pwd)"
        python "${ROOT}/scripts/check-adrs.py" --consumer --legacy-up-to "${SDAF_ADRS_LEGACY_UP_TO:-0}" --root "${GITHUB_WORKSPACE}"
    - name: Gate 0 (comprobaciones mecánicas)
      if: inputs.check-gate0 == 'true'
      shell: bash
      env:
        SDAF_ACTION_ROOT: ${{ github.action_path }}
        SDAF_GATE0_PBI: ${{ inputs.gate0-pbi }}
      run: |
        set -euo pipefail
        ROOT="$(cd "${SDAF_ACTION_ROOT}/../../.." && pwd)"
        ARGS=(--root "${GITHUB_WORKSPACE}")
        # Separar por espacios sin expandir comodines; el valor nunca se interpreta como código.
        set -f
        # shellcheck disable=SC2206
        PBIS=(${SDAF_GATE0_PBI})
        set +f
        if [ "${#PBIS[@]}" -gt 0 ]; then
          for pbi in "${PBIS[@]}"; do
            case "${pbi}" in
              -*) echo "gate0-pbi: «${pbi}» empieza por «-»; se esperan IDs o rutas de PBI" >&2; exit 2 ;;
            esac
          done
          ARGS+=(--pbi "${PBIS[@]}")
        fi
        python "${ROOT}/scripts/check-gate0.py" "${ARGS[@]}"
