# sdaf.version "0.4.0" = línea de constitución; pin de árbol v0.4.0 (con pin v0.3.3, usar "0.3.0").

sdaf:
  version: "0.4.0"

project:
  name: MiProyecto
  language: es

stack:
  pack: null
  src_path: src
  tests_path: tests

agents:
  active:
    - specification
    - architecture
    - testing-review
  stubs:
    - product
    - domain
    - application
    - devops
    - review
    - testing
  fusions: {}
