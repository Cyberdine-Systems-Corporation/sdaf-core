# Esquema de `sdaf.config.yaml` (consumidor) — línea vigente

Catálogo **humano** de claves. La fuente de **validación** ejecutable es [`sdaf.config.schema.json`](sdaf.config.schema.json).

El archivo vive en la **raíz del repo consumidor**. Materializa nombre, idioma, rutas de código, pack de stack (opcional), el modelo de agentes y el tooling externo (opcional).

Si `stack.packs` declara algún pack, cumplir [`docs/contrato-pack-stack.md`](docs/contrato-pack-stack.md).

Catálogo y ejemplos: [`examples/README.md`](examples/README.md).

---

## Claves

### `sdaf` (obligatorio)

| Clave | Tipo | Obligatorio | Valores | Uso |
|-------|------|-------------|---------|-----|
| `sdaf.version` | string semver | sí | p. ej. `"0.5.0"` | Versión del **sdaf-core** adoptada. Subirla es un upgrade consciente del método (changelog del core). |

### `project` (obligatorio)

| Clave | Tipo | Obligatorio | Valores | Uso |
|-------|------|-------------|---------|-----|
| `project.name` | string | sí | no vacío | Sustituye `{{PROJECT_NAME}}` al materializar `AGENTS.md`. Aparece en README/worklogs del consumidor. |
| `project.language` | string | sí | `es` en la línea vigente | Idioma de artefactos de ingeniería (commits, PRs, handbook, specs, ADRs, prompts, worklogs). La línea vigente solo admite `es` (regla de castellano). Otros códigos quedan **fuera** hasta que el core los soporte. La restricción está registrada en [ADR-009](architecture/decisions/ADR-009-idioma-de-artefactos.md). |

### `stack` (obligatorio como bloque; campos internos con default)

Gobernanza de **dónde** está el código y **si** hay pack técnico. No fija el runtime: el pack es una capa opcional. `stack.overlay.replaces` solo declara qué ids de extensión sustituye la capa del consumidor; no adopta ni cambia packs. El código se declara con `stack.units` (una o varias unidades) o, para una sola, con el atajo `stack.src_path` y `stack.tests_path`.

| Clave | Tipo | Obligatorio | Default | Uso |
|-------|------|-------------|---------|-----|
| `stack.packs` | lista de strings | sí, salvo que se use el alias `stack.pack` (puede ser `[]`) | `[]` | Referencias `id@version` de los packs adoptados (`["sdaf-stack-example@0.3.0"]`), sin repetidos y con un id por pack: dos referencias con el mismo id son error aunque difiera la versión. `[]` = solo método; skills/agentes de UI/infra no existen salvo que el consumidor los añada a mano. |
| `stack.pack` | string \| `null` | no (alias obsoleto) | `null` | Alias obsoleto de `stack.packs` con un único elemento: `pack: "sdaf-stack-example@0.3.0"` equivale a `packs: ["sdaf-stack-example@0.3.0"]`. Con un valor no nulo el validador avisa y pide `stack.packs`. No puede coexistir con `stack.packs` (error, también con `packs: []`); `stack.pack: null` junto a `stack.packs` no entra en conflicto. |
| `stack.overlay.replaces` | lista de strings | no | sin default | Ids de extensión cuya sustitución explícita por el overlay del consumidor declara la config ([ADR-007](architecture/decisions/ADR-007-modelo-de-capas-y-precedencia.md) §5). Cada id debe estar declarado en `agents.active`, `agents.stubs` o `agents.fusions` (clave o miembro), no puede repetirse ni lleva espacios o saltos de línea en los extremos, y no vale para ids del núcleo: el validador lo rechaza. `overlay` es un objeto sin otras claves; `overlay: {}` y la clave ausente equivalen. |
| `stack.units` | lista de objetos | no | sin default | Unidades de código del consumidor, cada una con `name`, `src` y, opcional, `tests`. Al menos una si se declara. Sus nombres coinciden con las unidades de la línea base ([ADR-005](architecture/decisions/ADR-005-linea-base-arquitectonica.md)); el validador no lo comprueba. Gate 0 y la comprobación de worklog usan las rutas de todas las unidades. No puede coexistir con `stack.src_path` ni con `stack.tests_path` (error). Reglas debajo de la tabla. |
| `stack.units[].name` | string | sí | — | Nombre de la unidad: texto libre, no vacío, único en la lista y sin espacios ni saltos de línea en los extremos. No tiene que ser kebab-case. |
| `stack.units[].src` | string | sí | — | Ruta relativa al código de la unidad. |
| `stack.units[].tests` | string | no | sin default | Ruta relativa a los tests de la unidad. Puede quedar dentro de `src`. |
| `stack.src_path` | string | no | `src` | Atajo de una sola unidad: ruta relativa al código de producto. Gate 0 y skills de implementación la usan en lugar de asumir `src/`. No se valida más allá de ser texto y no puede coexistir con `stack.units`. |
| `stack.tests_path` | string | no | `tests` | Atajo de una sola unidad: ruta relativa a tests derivados de specs. No se valida más allá de ser texto y no puede coexistir con `stack.units`. |

`stack.units` es la forma general; `src_path` y `tests_path` son el atajo de una sola unidad y no están obsoletos (a diferencia de `stack.pack`). Los scripts que leen las rutas de código usan todas las unidades.

Reglas de `stack.units` (se aplican con cualquier `sdaf.version`):

- **Coexistencia:** declarar `stack.units` junto a `stack.src_path` o `stack.tests_path` (cualquiera de las dos claves) es error.
- **Nombre:** no puede repetirse en la lista ni llevar espacios o saltos de línea en los extremos; el mensaje nombra el índice de la unidad repetida y el valor.
- **Rutas (`src` y `tests`):** relativas, sin ruta absoluta (no empiezan por `/` ni `\`, ni por letra de unidad con `:`), sin segmento `..`, sin ser `.` ni llevar segmentos `.` o vacíos (una ruta así abarcaría todo el repo o nunca coincidiría con el diff) y sin espacios o saltos de línea en los extremos. Se aceptan `/` y `\` como separador y una barra final. Es error.
- **Solape:** si la ruta de una unidad (`src` o `tests`) es igual a la de otra unidad o está dentro de ella, el validador **avisa**; no cambia el código de salida. Se compara por segmentos (`apps/api` no solapa con `apps/api2`). Una unidad con `tests` dentro de su propio `src` no avisa.

Ejemplo con dos unidades (una sin `tests`):

    stack:
      packs: []
      units:
        - name: Unidad A
          src: apps/api
          tests: tests/api
        - name: Unidad B
          src: libs/core

### `agents` (obligatorio)

| Clave | Tipo | Obligatorio | Uso |
|-------|------|-------------|-----|
| `agents.active` | lista de ids | sí (≥1) | Agentes que entran en el handoff por defecto. Deben tener contrato + prompt. |
| `agents.stubs` | lista de ids | sí (puede ser `[]`) | Contratos listos, **no** invocados salvo encargo humano explícito. |
| `agents.fusions` | mapa id → lista de ids | no | `{}` si no hay fusiones. La clave es el id **fusionado** (debe estar en `active`); los miembros suelen estar en `stubs` o ausentes de `active`. |

#### Ids reconocidos por el core (línea vigente)

| Id | Rol | En el core |
|----|-----|------------|
| `specification` | Specs | activo típico |
| `architecture` | ADRs / boundaries | activo típico |
| `testing-review` | Tests + review (fusión) | activo típico |
| `product` | Backlog / PO | stub |
| `domain` | Modelo de dominio | stub |
| `application` | Slices de aplicación | stub |
| `devops` | CI / runtime | stub |
| `review` | Review puro | stub |
| `testing` | Tests puros | stub |

#### Ids de extensión (pack o consumidor; no van en el núcleo)

| Id | Cuándo |
|----|--------|
| `domain-application` | Fusión MVP de implementación |
| `frontend` | UI (el pack define el framework) |
| `infrastructure` | Persistencia / adapters |
| `ai` | Ingeniería de prompts de producto (no confundir con agentes SDAF) |

#### Invariantes

1. Un id **no** puede estar a la vez en `active` y `stubs`.
2. Toda clave de `fusions` debe aparecer en `active`.
3. Los miembros de una fusión no deben estar en `active` (evitar dos dueños del mismo trabajo).
4. Ids de extensión requieren algún pack en `stack.packs` (o el alias `stack.pack`) o contratos locales en el consumidor; el core no los envía. El validador emite **aviso** por defecto; `--strict-i4` lo convierte en error. Con `--consumer-root` (la action `validate-sdaf` lo pasa siempre) el mensaje nombra además los ids sin contrato en `agents/<id>-agent.md`; no comprueba el prompt, y tener el contrato no retira el aviso ni el error.

### `tooling` (opcional)

Tooling externo de agentes que el consumidor **adopta por elección propia** ([ADR-004](architecture/decisions/ADR-004-tooling-externo-de-agentes.md)). Ninguna skill ni gate del core lo presupone: sin el bloque, el método funciona igual.

| Clave | Tipo | Obligatorio | Default | Uso |
|-------|------|-------------|---------|-----|
| `tooling.gentle_ai` | string semver \| SHA de 40 hex \| `null` | no | `null` (o bloque ausente) | Versión de gentle-ai adoptada: una release (`"4.2.0"`) o un SHA de commit completo. No una rama: `main` cambia sin aviso. `null` = no adoptado. Si se declara, el `AGENTS.md` del consumidor lleva la cláusula de precedencia de [`docs/integracion-gentle-ai.md`](docs/integracion-gentle-ai.md). No cambia Gate 0 ni el router. |

- **T1 (aviso):** si `gentle_ai` es una release ≤ `3.7.0`, el validador avisa de que incluye el componente `sdd`, que no se instala (desde v4.0.0 el componente no existe; [ADR-004](architecture/decisions/ADR-004-tooling-externo-de-agentes.md)). No cambia el exit code.
- Un SHA no dispara T1: el validador no sabe, sin red, si es anterior a la retirada de SDD (v4.0.0). Para adoptar gentle-ai sin SDD, declara una release ≥ `4.0.0` (la guía revisa `4.2.0`) o un SHA igual o posterior al merge `520ed86e8c598b01f439e28c34d391cd6f1744e3`.

---

## Relación con artefactos

```text
sdaf.config.yaml
    → AGENTS.md          (desde AGENTS.md.template + project.name + agents.*)
    → sdaf-gate0         (rutas de código: stack.units o src_path/tests_path)
    → sdaf-agent-router  (active / stubs / fusions)
    → packs de stack     (si stack.packs no está vacío)
    → AGENTS.md          (cláusula de precedencia si tooling.gentle_ai != null)
```
