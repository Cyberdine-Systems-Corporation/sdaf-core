site_name: SDAF Core
site_description: Constitución, agentes, prompts y skills del Spec-Driven AI Development Framework
repo_url: https://github.com/Cyberdine-Systems-Corporation/sdaf-core
repo_name: sdaf-core
edit_uri: edit/main/
# Raíz del repo para que logo/favicon y docs/assets resuelvan en CI.
# site_dir NO puede quedar dentro de docs_dir (MkDocs lo prohíbe).
docs_dir: ..
site_dir: !ENV [MKDOCS_SITE_DIR, "/tmp/sdaf-core-mkdocs-site"]

# MkDocs excluye por defecto '.*' y '/templates/' del docs_dir (ver
# https://www.mkdocs.org/user-guide/configuration/#exclude_docs). Se niegan
# aquí porque sdaf-core tiene contenido real en templates/, .github/ y
# .cursor/rules/, y se vuelve a excluir lo que sí es tooling puro dentro
# de .github/ y examples/.
exclude_docs: |
  /mkdocs/
  /site/
  !/templates/
  !/.github/
  !/.cursor/
  /.github/workflows/
  /examples/*.yaml
  /handbook/_meta/
  /handbook/index.yaml
  /scripts/testdata/
  /docs/assets/_tools/
  /docs/assets/*.html

not_in_nav: |
  /worklog.schema.json
  /worklogs/
  /.github/actions/

theme:
  name: material
  language: es
  logo: docs/assets/sdaf-core-icon.svg
  favicon: docs/assets/sdaf-core-icon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Modo oscuro }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Modo claro }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - docs/stylesheets/branding.css

markdown_extensions:
  - admonition
  - pymdownx.blocks.admonition:
      types: [note, tip, warning, caution, danger]
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true
      # GFM/GitHub conservan tildes; el slugify por defecto de Python-Markdown las elimina
      # (p. ej. «Pre-implementación» → ancla distinta de #3-gate-0-pre-implementación-stop).
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode

extra:
  version:
    provider: mike

