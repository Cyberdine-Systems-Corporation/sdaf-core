# Techo v0.3: todas las claves del esquema, explícitas.
# Uso: plantilla de auditoría o para no depender de defaults. No es el default recomendado
# (muchos activos + pack + fusiones + rutas custom = más superficie de handoff).
# Combina: version, name, language, pack, src_path, tests_path, active, stubs, fusions, tooling.
# tooling es opcional: aquí se declara gentle-ai solo para mostrar la clave (ADR-004).
# El SHA es el commit de main que retira SDD; se instala con `go install .../cmd/gentle-ai@<sha>`.
# Ids de extensión (frontend, infrastructure, ai, domain-application) exigen pack o contratos locales.

sdaf:
  version: "0.4.0"

project:
  name: MiProyecto
  language: es

stack:
  pack: sdaf-stack-dotnet@0.3.0
  src_path: apps/web
  tests_path: tests/acceptance

agents:
  active:
    - specification
    - architecture
    - domain-application
    - frontend
    - testing-review
  stubs:
    - product
    - domain
    - application
    - infrastructure
    - devops
    - review
    - testing
    - ai
  fusions:
    testing-review: [testing, review]
    domain-application: [domain, application]

tooling:
  gentle_ai: "520ed86e8c598b01f439e28c34d391cd6f1744e3"
